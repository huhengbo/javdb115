[project]
name = "javdb115-backend"
version = "0.1.1"
description = "Mobile-first JAVDB to 115 automation backend"
requires-python = ">=3.12,<4.0"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "croniter>=6.2.4",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "p115client>=0.0.9.6.5.1,<0.0.10",
  "pillow>=12.3.0",
  "pydantic>=2.13.5",
  "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.7",
  "mypy>=2.3.1",
  "types-croniter>=6.2.4.20260711",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
constraint-dependencies = [
  "msgpack>=1.2.1",
  "setuptools>=84.0.0",
  "soupsieve>=2.8.4",
  "starlette>=1.3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
