name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Check project version
        run: python scripts/check_version.py
      - name: Ruff
        run: ruff check backend/app backend/tests scripts
      - name: Mypy
        run: mypy backend/app
      - name: Compile
        run: python -m compileall -q backend/app backend/tests scripts
      - name: Tests
        run: pytest backend/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Web E2E smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e backend
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Assemble web application
        run: |
          rm -rf backend/app/static
          cp -R frontend/dist backend/app/static
      - name: Start application and verify cookie login flow
        env:
          APP_ADMIN_PASSWORD: e2e-password
          APP_SECRET_KEY: e2e-secret-key-for-ci-only
          APP_DATABASE_PATH: ${{ runner.temp }}/javdb115-e2e.sqlite3
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 18080 >"${RUNNER_TEMP}/javdb115.log" 2>&1 &
          APP_PID=$!
          trap 'kill "${APP_PID}" 2>/dev/null || true; cat "${RUNNER_TEMP}/javdb115.log"' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null
          curl --fail --silent \
            --cookie-jar "${RUNNER_TEMP}/cookies.txt" \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"e2e-password"}' \
            http://127.0.0.1:18080/api/auth/login | grep -q '"username":"admin"'
          curl --fail --silent \
            --cookie "${RUNNER_TEMP}/cookies.txt" \
            http://127.0.0.1:18080/api/auth/me | grep -q '"username":"admin"'
          curl --fail --silent http://127.0.0.1:18080/ | grep -q 'id="root"'

  docker:
    name: Docker security + build (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build native image for vulnerability scan
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: javdb115:ci-security-check
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: javdb115:ci-security-check
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - uses: docker/setup-qemu-action@v4.3.0
      - name: Build multi-platform image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
