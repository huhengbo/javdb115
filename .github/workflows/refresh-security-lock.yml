name: Refresh security lock

on:
  push:
    branches: [fix/trivy-release-blockers]
    paths:
      - backend/pyproject.toml
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/trivy-release-blockers
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.13
      - name: Refresh lockfile
        working-directory: backend
        run: uv lock --upgrade
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- backend/uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "security: refresh locked dependencies"
          git push origin HEAD:fix/trivy-release-blockers
