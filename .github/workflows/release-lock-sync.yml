name: Release Lock Sync

on:
  push:
    branches: ["release/v0.1.2"]

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release/v0.1.2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Sync backend lockfile
        run: |
          python -m pip install 'uv==0.12.13'
          cd backend
          uv lock
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- backend/uv.lock; then
            echo "backend/uv.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "chore(release): sync backend lockfile"
          git push origin HEAD:release/v0.1.2
