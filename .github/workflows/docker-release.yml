name: Docker Release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-image:
    name: Validate runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build native image for scan and smoke test
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: javdb115:release-check
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: javdb115:release-check
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Smoke test non-root runtime
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name javdb115-release-check \
            -p 18080:8080 \
            -e APP_ADMIN_PASSWORD=e2e-password \
            -e APP_SECRET_KEY=e2e-secret-key-for-release-validation \
            javdb115:release-check
          trap 'docker rm -f javdb115-release-check >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null
          test "$(docker exec javdb115-release-check id -u)" != "0"

  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    needs: validate-image
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: version
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          IS_RELEASE=false

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION v${VERSION}" >&2
              exit 1
            fi
            IS_RELEASE=true
          elif [[ "${GITHUB_REF}" == "refs/heads/master" && "${HEAD_MESSAGE}" == "chore(release): prepare v${VERSION}"* ]]; then
            IS_RELEASE=true
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "is_release=${IS_RELEASE}" >> "${GITHUB_OUTPUT}"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_release == 'true' }}
      - name: Build and push amd64 + arm64
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub Release
    if: needs.publish.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Generate Chinese release notes
        run: >-
          python scripts/generate_release_notes.py
          --version '${{ needs.publish.outputs.version }}'
          --output release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "JavDB 115 $RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "JavDB 115 $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
