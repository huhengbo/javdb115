name: Feature request
description: 提议新功能或改进
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景 / 问题
      description: 说明当前痛点或使用场景。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述你期望的行为、交互或实现方向。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已考虑过的其他方案。
  - type: textarea
    id: extra
    attributes:
      label: 其他信息
